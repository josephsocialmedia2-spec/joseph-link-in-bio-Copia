<!doctype html><html lang="it"><head><meta charset="utf-8"><title>OCME PDF DOCX smoke</title><style>body{font:14px system-ui;padding:20px}li{margin:7px}.ok{color:green}.bad{color:crimson}iframe{width:100%;height:520px;border:1px solid #ddd}</style></head><body><h1>Test lettura PDF e DOCX senza nuovo caricamento</h1><p id="status">Preparazione...</p><ol id="report"></ol><iframe id="frame" src="../index.html?docs=1"></iframe><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>
(async function(){const $=id=>document.getElementById(id),report=$('report'),iframe=$('frame');let d,ids=[],passed=0,failed=0,prior=localStorage.getItem('ocme-unified-current');
function log(ok,msg){let li=document.createElement('li');li.className=ok?'ok':'bad';li.textContent=(ok?'✓ ':'✕ ')+msg;report.append(li);ok?passed++:failed++}
const pause=ms=>new Promise(res=>setTimeout(res,ms));
async function wait(fn,timeout=18000){let start=Date.now();while(Date.now()-start<timeout){try{if(fn())return}catch(e){}await pause(120)}throw Error('Timeout in: '+String(fn).slice(0,65))}
const enter=(id,text)=>{d.getElementById(id).value=text;d.getElementById(id).dispatchEvent(new Event('input',{bubbles:true}))};
async function upload(file,title){d=iframe.contentDocument;d.getElementById('switch').click();await wait(()=>!d.getElementById('home').hidden);let dt=new DataTransfer();dt.items.add(file);d.getElementById('newFile').files=dt.files;enter('newTopic',title);enter('newSubject','Matematica');d.getElementById('create').click();await wait(()=>!d.getElementById('organize').hidden,30000);d.getElementById('switch').click();await wait(()=>[...d.querySelectorAll('.projectItem')].some(el=>el.textContent.includes(title)));let item=[...d.querySelectorAll('.projectItem')].find(el=>el.textContent.includes(title));ids.push(item.querySelector('[data-openproject]').dataset.openproject);item.querySelector('[data-openproject]').click();await wait(()=>!d.getElementById('organize').hidden);d.querySelector('[data-view="comprehend"]').click();await wait(()=>!d.getElementById('comprehend').hidden);return d.getElementById('originalPage').textContent}
try{await wait(()=>iframe.contentDocument?.getElementById('create'));d=iframe.contentDocument;await wait(()=>d.body.dataset.ocmeReady==='1');if(!window.PDFLib)throw Error('PDFLib CDN non disponibile');const pdf=await PDFLib.PDFDocument.create(),page=pdf.addPage([520,700]);page.drawText('TEOREMA DI CARNOT', {x:40,y:630,size:18});page.drawText('Il triangolo ha due lati noti e angolo compreso.',{x:40,y:600,size:12});page.drawText('Formula a2 = b2 + c2 - 2bc cosA',{x:40,y:580,size:12});const pdfBytes=await pdf.save();let text=await upload(new File([pdfBytes],'carnot-prova.pdf',{type:'application/pdf'}),'PROVA AUTOMATICA PDF');log(text.includes('TEOREMA DI CARNOT')&&text.includes('triangolo'),'PDF estratto e disponibile nel progetto senza ricarica');if(!window.JSZip)throw Error('JSZip CDN non disponibile');let zip=new JSZip();zip.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');zip.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');zip.file('word/document.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body><w:p><w:r><w:t>TEOREMA DEI SENI</w:t></w:r></w:p><w:p><w:r><w:t>Nel triangolo i lati sono proporzionali ai seni degli angoli opposti.</w:t></w:r></w:p></w:body></w:document>');let blob=await zip.generateAsync({type:'blob'});text=await upload(new File([blob],'seni-prova.docx',{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}),'PROVA AUTOMATICA DOCX');log(text.includes('TEOREMA DEI SENI')&&text.includes('triangolo'),'DOCX estratto e disponibile nel progetto senza ricarica')}
catch(e){log(false,'ERRORE: '+e.message)}
finally{try{let req=indexedDB.open('ocme-study-v3');req.onsuccess=()=>{const db=req.result,tx=db.transaction(['projects','files'],'readwrite');ids.forEach(id=>{tx.objectStore('projects').delete(id);tx.objectStore('files').delete(id)});tx.oncomplete=()=>db.close()}}catch(e){}if(prior)localStorage.setItem('ocme-unified-current',prior);else localStorage.removeItem('ocme-unified-current');$('status').textContent=passed+' test superati · '+failed+' errori';document.title='Test documenti OCME: '+passed+'/'+(passed+failed)}})();
</script></body></html>
