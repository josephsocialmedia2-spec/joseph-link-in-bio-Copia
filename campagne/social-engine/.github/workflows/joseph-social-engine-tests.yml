# Relocate this workflow to root .github/workflows/ for GitHub Actions execution.
name: Joseph Social Engine CI
on: [workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r campagne/social-engine/requirements.txt
      - run: PYTHONPATH=campagne/social-engine python -m unittest discover -s campagne/social-engine/tests -v
