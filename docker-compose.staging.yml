services:
  zero-to-diamond-lab:
    image: python:3.12-slim
    working_dir: /project
    volumes:
      - ./:/project:ro
    environment:
      STAGING_HOST: 0.0.0.0
      STAGING_PORT: "8765"
    command: python3 tools/staging/server.py
    ports:
      - "127.0.0.1:8765:8765"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
