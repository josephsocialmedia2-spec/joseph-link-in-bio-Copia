name: "CASE247 - verify original photo media"
on:
  push:
    branches: ["feature/case247-joseph-personal-posts-20261101"]
    paths:
      - "scripts/case247_canva_probe.py"
      - ".github/workflows/case247-canva-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - name: Check full-resolution image endpoint
        env:
          URL: "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F990961cf-f754-4466-a197-9c02cdbf2fc9/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAMSMbSZXNaJq1J6gneIN4Zj5QXKiZxL061rwfVFkpvg2&exp=1793574700&osig=AAAAAAAAAAAAAAAAAAAAAD4LBSy_LXM_1iGafzDNzX86ItxrMJ5yn-wfvBKBtant&signer=media-rpc&token=AAIAAU0AJDk5MDk2MWNmLWY3NTQtNDQ2Ni1hMTk3LTljMDJjZGJmMmZjOQAAAAABoZliA-DsQOTAjofmT3sE2yXogExKTotIhHiC6SQvGuFzKjes9g&x-canva-quality=thumbnail"
        run: python scripts/case247_canva_probe.py
