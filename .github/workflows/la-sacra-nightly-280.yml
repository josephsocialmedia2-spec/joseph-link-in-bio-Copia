name: LA SACRA - Censimento aziende automatico sospeso
# Raccolta notturna 280 aziende disattivata per richiesta dell'utente.
# Le precedenti esecuzioni e i relativi artefatti rimangono nello storico Actions.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  censimento_sospeso:
    runs-on: ubuntu-latest
    steps:
      - name: Nessuna ricerca automatica di aziende
        run: echo "Censimento notturno disattivato; nessuna raccolta né email."
