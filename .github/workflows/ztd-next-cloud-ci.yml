name: ZTD Next.js Cloud Backend (code only)
on:
  push:
    branches:
      - feat/ztd-next-cloud-backend-20261123
    paths:
      - 'apps/ztd-operations/**'
      - '.github/workflows/ztd-next-cloud-ci.yml'
  pull_request:
    paths:
      - 'apps/ztd-operations/**'
      - '.github/workflows/ztd-next-cloud-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ztd-operations
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9e4d87 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned code dependencies without scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax checks
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Next.js production build (no cloud credentials)
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Confirm no cloud services were invoked
        run: echo "No Supabase schema, Google Drive writes, cron activation, deployment, or production release performed"
