name: ZTD Next.js Cloud Backend (code only)
on:
  push:
    branches:
      - feat/ztd-next-cloud-backend-20261123
    paths:
      - 'apps/ztd-operations/**'
      - '.github/workflows/ztd-next-cloud-ci.yml'
  pull_request:
    paths:
      - 'apps/ztd-operations/**'
      - '.github/workflows/ztd-next-cloud-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ztd-operations
    steps:
      - uses: actions/checkout@v4 # v4.2.2
      - uses: actions/setup-node@v4 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned code dependencies without scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Save dependency lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: ztd-package-lock
          path: apps/ztd-operations/package-lock.json
          if-no-files-found: error
      - name: Syntax checks
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Next.js production build (no cloud credentials)
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Confirm no cloud services were invoked
        run: echo "No Supabase schema, Google Drive writes, cron activation, deployment, or production release performed"
