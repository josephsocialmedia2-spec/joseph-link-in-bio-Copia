name: CASE247 Regia territoriale 10km · verifica 06:00 e 18:00
on:
  push:
    branches:
      - main
      - feature/case247-10km-integrated-20261113
    paths:
      - scripts/case247_territorial_engine.py
      - scripts/test_case247_territorial_engine.py
      - scripts/test_case247_territorial_publisher_policy.py
      - scripts/case247_schedule_guard.py
      - scripts/test_case247_schedule_guard.py
      - scripts/case247_legacy_transition.py
      - scripts/test_case247_legacy_transition.py
      - scripts/case247_quality_gate.py
      - scripts/test_case247_quality_gate.py
      - config/case247-territorio.json
      - scripts/sync_sacra_catalog.py
      - .github/workflows/case247-territorial-regia.yml
  workflow_dispatch:
    inputs:
      geocode:
        description: "Aggiorna la geolocalizzazione verificabile"
        type: boolean
        default: true
  schedule:
    # UTC hour pairs cover 06:00 and 18:00 Rome across DST changes.
    - cron: "0 4,5,16,17 * * *"
permissions:
  contents: write
concurrency:
  group: case247-territorial-regia
  cancel-in-progress: false

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax
        run: python -m py_compile scripts/case247_territorial_engine.py scripts/sync_sacra_catalog.py
      - name: Geofence and duplicate-safety suite
        run: |
          python -m unittest discover -s scripts -p test_case247_territorial_engine.py -v
          python -m unittest discover -s scripts -p test_case247_legacy_transition.py -v
          python -m unittest discover -s scripts -p test_case247_quality_gate.py -v
          python -m unittest discover -s scripts -p test_case247_territorial_publisher_policy.py -v
          python -m unittest discover -s scripts -p test_case247_schedule_guard.py -v

  nightly-reconcile:
    needs: unit-tests
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Idempotent morning/evening plan guard with delayed-cron recovery
        id: local
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python scripts/case247_schedule_guard.py
      - name: Synchronize live La Sacra catalog
        if: steps.local.outputs.active == 'true'
        run: python scripts/sync_sacra_catalog.py
      - name: Rebuild 41-town drafts
        if: steps.local.outputs.active == 'true'
        run: python scripts/build_territorial_drafts.py
      - name: Reconcile and prepare next-day territorial rotation
        if: steps.local.outputs.active == 'true'
        env:
          GEOCODE: ${{ inputs.geocode }}
        run: |
          if [[ "$GEOCODE" == "false" ]]; then
            python scripts/case247_territorial_engine.py
          else
            python scripts/case247_territorial_engine.py --geocode
          fi
      - name: Audit CASE247 media, reservations, account safety
        if: steps.local.outputs.active == 'true'
        run: python scripts/case247_quality_gate.py
      - name: Validate output integrity
        if: steps.local.outputs.active == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('campagne/case247/regia-territoriale/latest-plan.json').read_text())
          a=[p for p in x['assignments'] if p['type']=='IMMOBILE']
          assert len({p['listing_id'] for p in a})==len(a)
          assert x['max_distance_km'] == 10
          assert all(p['distance_upper_bound_km'] <= 10 for p in a)
          print('Verified', len(a), 'unique scheduled candidates', 'ready for provider', x['ready_for_provider'])
          PY
      - name: Commit audited catalog and scheduling plans
        if: steps.local.outputs.active == 'true'
        run: |
          git config user.name case247-territorial-bot
          git config user.email case247-territorial-bot@users.noreply.github.com
          git add immobili/catalogo.json config/case247-geo-verified.json campagne/case247/territorio/bozze.json campagne/case247/regia-territoriale/
          if ! git diff --cached --quiet; then
            git commit -m "CASE247: riconciliazione territoriale delle 18"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

