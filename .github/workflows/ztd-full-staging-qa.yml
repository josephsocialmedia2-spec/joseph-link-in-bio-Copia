name: Zero to Diamond · Full STAGING QA
on:
  pull_request:
    paths:
      - 'tools/staging/**'
      - '.devcontainer/**'
      - 'docker-compose.staging.yml'
      - 'scripts/ztd_staging_browser_qa.cjs'
      - '.github/workflows/ztd-full-staging-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-site:
    name: Isolated full-system navigation and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and isolated server tests
        run: |
          python3 -m py_compile tools/staging/server.py tools/staging/test_staging.py
          python3 -m unittest discover -s tools/staging -p 'test_*.py' -v
          node --check scripts/ztd_staging_browser_qa.cjs
      - name: Install browser automation
        run: |
          npm install --no-save playwright@1.57.0
          google-chrome --version
      - name: Browser smoke of all major modules (no production writes)
        run: node scripts/ztd_staging_browser_qa.cjs
      - name: Record staging test protocol
        if: always()
        run: |
          echo 'Preview is isolated: no production APIs, no messages or writes.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Portal path: /__staging__/' >> "$GITHUB_STEP_SUMMARY"
          echo 'Use Codespaces on the staging branch with forwarded private port 8765.' >> "$GITHUB_STEP_SUMMARY"
