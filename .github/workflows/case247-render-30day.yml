name: CASE247 30-day calendar graphics renderer (draft only)
on:
  push:
    branches: [main]
    paths:
      - scripts/case247_render_30day_calendar.py
      - campagne/case247/editorial-queue/2026-11-10_2026-12-09/queue.json
      - .github/workflows/case247-render-30day.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: case247-30day-graphics
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install graphic renderer
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate 60 JPEG 1080x1350 without publishing
        run: python scripts/case247_render_30day_calendar.py
      - name: Check all media files
        run: |
          test "$(find campagne/case247/editorial-queue/2026-11-10_2026-12-09/assets -name '*.jpg' | wc -l)" -eq 60
          file campagne/case247/editorial-queue/2026-11-10_2026-12-09/assets/*.jpg | grep -q 'JPEG image data'
      - name: Save draft graphics to GitHub (no Meta API)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'case247-graphics-bot'
          git config user.email 'case247-graphics-bot@users.noreply.github.com'
          git add campagne/case247/editorial-queue/2026-11-10_2026-12-09/assets/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'CASE247: 60 draft JPEG graphics for new calendar, no Meta publication'
            pushed=0
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then pushed=1; break; fi
              git fetch origin main
              git rebase origin/main
              sleep 3
            done
            [[ "$pushed" == "1" ]] || exit 1
          fi
