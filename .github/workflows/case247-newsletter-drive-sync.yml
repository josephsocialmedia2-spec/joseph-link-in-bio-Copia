name: CASE247 - Sincronizza CRM Newsletter su Google Drive
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: case247-newsletter-drive-sync
  cancel-in-progress: false
jobs:
  sync_google_sheets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CASE247_NEWSLETTER_SERVICE_ROLE_KEY: ${{ secrets.CASE247_NEWSLETTER_SERVICE_ROLE_KEY }}
      CASE247_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.CASE247_SHEETS_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Google authentication and HTTP dependencies
        run: pip install google-auth==2.43.0 requests==2.32.5
      - name: Sync private CRM
        run: python scripts/sync_case247_newsletter_drive.py
