name: CASE247 Volantino Avigliana Audit
on:
  pull_request:
    paths:
      - 'gestione/volantini-premium/**'
      - 'tests/case247-volantino-avigliana.test.cjs'
      - 'tests/case247-two-a5-front.test.cjs'
      - '.github/workflows/case247-volantino-avigliana.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint and tests
        run: |
          node --check gestione/volantini-premium/app.js
          node --check gestione/volantini-premium/pdf-engine.js
          node --test tests/case247-volantino-avigliana.test.cjs tests/case247-two-a5-front.test.cjs
