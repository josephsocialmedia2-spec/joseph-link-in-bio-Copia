name: Andrea Assistente Android APK
on:
  push:
    branches: [andrea-assistente-android]
    paths:
      - 'andrea-assistente/**'
      - '.github/workflows/andrea-assistente-apk.yml'
  pull_request:
    paths:
      - 'andrea-assistente/**'
      - '.github/workflows/andrea-assistente-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK path
        run: |
          echo "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
      - name: Accept installed Android SDK licenses
        run: yes | sdkmanager --licenses || true
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build signed debug APK
        run: gradle -p andrea-assistente --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Andrea-Assistente-APK
          path: andrea-assistente/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
