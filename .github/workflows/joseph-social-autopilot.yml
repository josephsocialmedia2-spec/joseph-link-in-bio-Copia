name: Joseph Social GPT Image Manual Only
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: joseph-social-autopilot
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r campagne/social-engine/requirements.txt
      - name: Generate with OpenAI brand gate, captions and stage max 2
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          PYTHONPATH=campagne/social-engine python -m social_engine.autopilot
          --root /tmp/joseph-social-outbox
          --input campagne/assets/rmp-piano-social-63-post.csv
          campagne/assets/piano-social-attivita-54-post-2026.csv
          --portrait assets/joseph-malafronte.webp
          --repo josephsocialmedia2-spec/joseph-link-in-bio-Copia
          --start 2026-11-01T08:00:00+01:00 --max-pending 2

      - name: Publish brand-approved media through official social APIs (explicit opt-in)
        env:
          SOCIAL_LIVE_PUBLISH: ${{ vars.SOCIAL_LIVE_PUBLISH }}
          BRAND_FIRST_BATCH_APPROVED: ${{ vars.BRAND_FIRST_BATCH_APPROVED }}
          GITHUB_TOKEN: ${{ github.token }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          LINKEDIN_OWNER_URN: ${{ secrets.LINKEDIN_OWNER_URN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: >-
          PYTHONPATH=campagne/social-engine python -m social_engine.publisher
          --repo josephsocialmedia2-spec/joseph-link-in-bio-Copia
