name: CASE247 Agenda 50 isolated QA and preview
on:
  pull_request:
    paths:
      - 'gestione/index.html'
      - 'gestione/agenda50.js'
      - 'gestione/agenda50.css'
      - 'gestione/studio-2scat-ui.js'
      - 'gestione/studio-compact.css'
      - 'tests/agenda50.test.cjs'
      - 'tests/agenda50-browser.cjs'
      - '.github/workflows/case247-agenda50-qa.yml'
  push:
    branches: [main]
    paths:
      - 'gestione/index.html'
      - 'gestione/agenda50.js'
      - 'gestione/agenda50.css'
      - 'gestione/studio-2scat-ui.js'
      - 'gestione/studio-compact.css'
      - 'tests/agenda50.test.cjs'
      - 'tests/agenda50-browser.cjs'
      - '.github/workflows/case247-agenda50-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agenda50-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check gestione/agenda50.js
          node --check gestione/studio-2scat-ui.js
          node --check tests/agenda50.test.cjs
          node --check tests/agenda50-browser.cjs
      - name: Unit test - date, caps, persistence and export
        run: node --test tests/agenda50.test.cjs
      - name: Browser integration - original SaaS unchanged
        run: node tests/agenda50-browser.cjs
      - name: Preview screenshot for PR review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: case247-agenda50-preview
          path: |
            /tmp/case247-agenda50-preview-desktop.png
            /tmp/case247-studio-compact-preview.png
          if-no-files-found: ignore
          retention-days: 14
