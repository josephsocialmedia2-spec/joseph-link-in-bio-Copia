name: "CASE247 - Render 12 approved creatives (NO Meta publishing)"
on:
  push:
    paths:
      - ".github/workflows/case247-render-approved.yml"
      - "campagne/case247/editorial-queue/render_approved_jpg.py"
      - "campagne/case247/editorial-queue/2026-11-01_2026-11-04/assets/*.svg"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: case247-approved-render
  cancel-in-progress: false
jobs:
  render:
    if: github.repository == 'josephsocialmedia2-spec/joseph-link-in-bio-Copia'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install local, no-paid-API renderer
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 CairoSVG==2.8.2
      - name: Render approved creatives into JPEG 1080x1350
        run: python campagne/case247/editorial-queue/render_approved_jpg.py
      - name: Commit only generated JPEGs (never publish on Meta)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'case247-content-bot'
          git config user.email 'case247-content-bot@users.noreply.github.com'
          git add -- 'campagne/case247/editorial-queue/2026-11-01_2026-11-04/assets/*.jpg'
          if git diff --cached --quiet; then
            echo 'JPEG già aggiornati.'
          else
            git commit -m 'CASE247: 12 JPEG per contenuti approvati (NON PUBBLICATI)'
            pushed=0
            for attempt in 1 2 3; do
              if git push; then pushed=1; break; fi
              git fetch origin main
              git rebase origin/main
              sleep 2
            done
            [[ "$pushed" == "1" ]] || { echo 'GitHub push fallito'; exit 1; }
          fi
