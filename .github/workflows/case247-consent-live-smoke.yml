name: "CASE247 live GDPR landing smoke"
on:
  push:
    branches: [main]
    paths:
      - 'scripts/case247_consent_live_smoke.py'
      - '.github/workflows/case247-consent-live-smoke.yml'
  pull_request:
    paths:
      - 'scripts/case247_consent_live_smoke.py'
      - '.github/workflows/case247-consent-live-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-consent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify published GitHub Pages, opt-in gate and API auth
        run: python scripts/case247_consent_live_smoke.py
