name: Build Diploma Guadagno Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'software/diploma-guadagno-android/**'
      - '.github/workflows/build-regia-android.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: software/diploma-guadagno-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: software/diploma-guadagno-android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Diploma-Guadagno-Android
          path: software/diploma-guadagno-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
