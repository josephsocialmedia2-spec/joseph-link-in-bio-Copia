name: "CASE247 repository audit - feature branch only"
on:
  push:
    branches: ['feature/case247-unified-regia-20261101']
    paths:
      - 'scripts/case247_repository_audit.py'
      - '.github/workflows/case247-inventory-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan repository locally (no external data upload)
        run: python scripts/case247_repository_audit.py
      - name: Commit audit inventory only on integration branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "feature/case247-unified-regia-20261101"
          git config user.name "case247-audit-bot"
          git config user.email "case247-audit-bot@users.noreply.github.com"
          git add audit/case247/repository-inventory.json audit/case247/repository-inventory.csv
          if ! git diff --cached --quiet; then
            git commit -m "CASE247: censimento pagine dal repository (audit)"
            git push
          fi
