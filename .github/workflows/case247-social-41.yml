name: CASE247 · Social network 41 towns safe rollout
on:
  pull_request:
    paths:
      - config/case247-territorio.json
      - config/case247-territorial-social-setup.json
      - supabase/functions/case247-territory-connect/**
      - gestione/territori/**
      - gestione/index.html
      - immobili/catalogo.js
      - immobili/catalogo.css
      - supabase/functions/case247-public-territory-social/**
      - scripts/test_case247_public_social_links.py
      - scripts/test_case247_social_41.py
      - scripts/test_case247_guided_meta_creation.py
      - .github/workflows/case247-social-41.yml
  push:
    branches: [main]
    paths:
      - config/case247-territorio.json
      - config/case247-territorial-social-setup.json
      - supabase/functions/case247-territory-connect/**
      - gestione/territori/**
      - gestione/index.html
      - immobili/catalogo.js
      - immobili/catalogo.css
      - supabase/functions/case247-public-territory-social/**
      - scripts/test_case247_public_social_links.py
      - scripts/test_case247_social_41.py
      - scripts/test_case247_guided_meta_creation.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 41 towns, 82 proposed identities and no fictitious accounts
        run: python -m unittest discover -s scripts -p test_case247_social_41.py -v
      - name: Preserve Avigliana OAuth pilot and no-send safety checks
        run: python -m unittest discover -s scripts -p test_case247_avigliana_pilot.py -v
      - name: Test official Meta creation guide and check embedded JavaScript
        run: |
          python -m unittest discover -s scripts -p test_case247_guided_meta_creation.py -v
          python - <<'PY'
          from pathlib import Path
          src=Path("gestione/territori/index.html").read_text()
          assert src.count('<script type="module">')==1, "Expect exactly one onboarding module"
          module=src.split('<script type="module">',1)[1].split('</script>',1)[0]
          Path("/tmp/case247-guided-meta-creation.mjs").write_text(module)
          PY
          node --check /tmp/case247-guided-meta-creation.mjs
      - name: Verify public links safety and shared 20km landing catalog JS
        run: |
          python -m unittest discover -s scripts -p test_case247_public_social_links.py -v
          node --check immobili/catalogo.js
      - name: No unsafe social sends in onboarding Edge Function
        run: |
          if grep -E -q '/photos|/media_publish|setTimeout.*publish' supabase/functions/case247-territory-connect/index.ts; then
            echo "No publishing allowed in onboarding handler"; exit 1
          fi
