<!-- CASE247 · Routine delle 03:00. Blocco autonomo, senza dipendenze. -->
<style>
#case247-routine03{--r03-ink:#283341;--r03-line:#dce3ea;--r03-muted:#6b7887;--r03-fill:#e8eef5;--r03-stroke:#3b434e;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--r03-ink);background:#fff;border:1px solid var(--r03-line);border-radius:10px;box-shadow:0 2px 10px rgba(26,42,62,.045);padding:10px 14px;margin:9px 14px;min-width:0}
#case247-routine03 *{box-sizing:border-box}
#case247-routine03 .r03-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
#case247-routine03 h2{font-size:14px;line-height:1.3;font-weight:760;letter-spacing:-.015em;margin:0;color:#243346}
#case247-routine03 .r03-subtitle{font-size:10px;margin:2px 0 0;color:var(--r03-muted)}
#case247-routine03 .r03-metrics{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}
#case247-routine03 .r03-calories{font-size:12px;font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}
#case247-routine03 .r03-today{font-size:10px;font-weight:500;color:var(--r03-muted);margin-left:4px}
#case247-routine03 .r03-reset{font:inherit;font-size:10px;color:var(--r03-muted);border:1px solid var(--r03-line);border-radius:5px;background:#fff;padding:5px 8px;cursor:pointer}
#case247-routine03 .r03-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#case247-routine03 .r03-card{display:flex;align-items:center;gap:9px;min-width:0;min-height:84px;padding:7px 9px;border:1px solid var(--r03-line);background:#fafbfd;border-radius:8px;opacity:1;transform:translateY(0);transition:opacity .28s ease,transform .28s ease}
#case247-routine03 .r03-card.r03-completing{opacity:0;transform:translateY(-9px);pointer-events:none}
#case247-routine03 .r03-card[hidden],#case247-routine03 .r03-grid[hidden]{display:none!important}
#case247-routine03 .r03-art{display:block;flex:0 0 86px;width:86px;height:67px;overflow:visible}
#case247-routine03 .r03-art .r03-shape{fill:var(--r03-fill);stroke:var(--r03-stroke);stroke-width:5.2;stroke-linecap:round;stroke-linejoin:round}
#case247-routine03 .r03-art .r03-line{fill:none;stroke:var(--r03-stroke);stroke-width:5.2;stroke-linecap:round;stroke-linejoin:round}
#case247-routine03 .r03-copy{flex:1;min-width:0}
#case247-routine03 .r03-name{display:block;font-size:12px;font-weight:750;line-height:1.25;color:#2a3442}
#case247-routine03 .r03-prescription{display:block;font-size:10px;color:var(--r03-muted);margin-top:4px}
#case247-routine03 .r03-estimate{font-size:10px;color:#5a6d80;white-space:nowrap;margin-top:3px}
#case247-routine03 .r03-check{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;white-space:nowrap;cursor:pointer}
#case247-routine03 .r03-check input{accent-color:#247c61;width:16px;height:16px;margin:0;cursor:pointer}
#case247-routine03 .r03-complete{font-size:11px;font-weight:650;color:#166b4d;background:#eff9f3;border:1px solid #c5e8d4;padding:10px 12px;border-radius:7px}
#case247-routine03 .r03-complete[hidden]{display:none!important}
#case247-routine03 .r03-notice{font-size:10px;color:#a04d34;margin:4px 0 0;min-height:0}
#case247-routine03 .r03-total.r03-pop{animation:r03-count-pop .38s ease-out}
@keyframes r03-push{0%,100%{transform:translateY(-1px)}50%{transform:translateY(7px)}}
@keyframes r03-crunch-upper{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(12deg)}}
@keyframes r03-crunch-lower{0%,100%{transform:rotate(9deg)}50%{transform:rotate(-9deg)}}
@keyframes r03-run-leg-a{0%,100%{transform:rotate(29deg)}50%{transform:rotate(-29deg)}}
@keyframes r03-run-leg-b{0%,100%{transform:rotate(-29deg)}50%{transform:rotate(29deg)}}
@keyframes r03-wheel{to{transform:rotate(360deg)}}
@keyframes r03-belt{to{transform:translateX(10px)}}
@keyframes r03-count-pop{0%{transform:scale(1)}50%{transform:scale(1.16);color:#188462}100%{transform:scale(1)}}
#case247-routine03 .r03-push-torso{animation:r03-push 1.6s ease-in-out infinite}
#case247-routine03 .r03-crunch-upper{transform-origin:61px 70px;animation:r03-crunch-upper 1.8s ease-in-out infinite}
#case247-routine03 .r03-crunch-lower{transform-origin:81px 72px;animation:r03-crunch-lower 1.8s ease-in-out infinite}
#case247-routine03 .r03-run-leg-a{transform-origin:88px 51px;animation:r03-run-leg-a .55s ease-in-out infinite}
#case247-routine03 .r03-run-leg-b{transform-origin:88px 51px;animation:r03-run-leg-b .55s ease-in-out infinite}
#case247-routine03 .r03-wheel{transform-box:fill-box;transform-origin:center;animation:r03-wheel 1s linear infinite}
#case247-routine03 .r03-belt{animation:r03-belt .5s linear infinite}
#saas-app:has(> #case247-routine03){grid-template-rows:56px auto 47px minmax(0,1fr)!important}
#saas-app > #case247-routine03{margin:6px 14px 4px;box-shadow:none}
@media(max-width:790px){
 #case247-routine03 .r03-card{gap:6px;padding:7px}
 #case247-routine03 .r03-art{width:61px;height:53px;flex-basis:61px}
 #case247-routine03 .r03-name{font-size:11px}
 #case247-routine03 .r03-prescription{font-size:9px}
 #case247-routine03 .r03-check{font-size:10px}
}
@media(max-width:620px){
 #saas-app:has(> #case247-routine03){grid-template-rows:50px auto 88px minmax(0,1fr)!important}
 #saas-app > #case247-routine03{margin:4px 8px 2px;padding:8px}
 #case247-routine03 .r03-header{gap:3px;margin-bottom:6px}
 #case247-routine03 .r03-metrics{width:100%;justify-content:space-between}
 #case247-routine03 .r03-grid{grid-template-columns:1fr;gap:5px}
 #case247-routine03 .r03-card{min-height:55px;padding:3px 7px}
 #case247-routine03 .r03-art{height:46px;width:57px;flex-basis:57px}
 #case247-routine03 .r03-check{margin-left:auto}
}
@media(max-height:650px){
 #case247-routine03 .r03-grid{grid-template-columns:repeat(3,minmax(165px,1fr));overflow-x:auto}
 #case247-routine03 .r03-card{min-height:60px}
}
@media(prefers-reduced-motion:reduce){
 #case247-routine03 *,#case247-routine03 *::before,#case247-routine03 *::after{animation:none!important;transition:none!important}
}
</style>
<section id="case247-routine03" aria-labelledby="r03-title">
  <div class="r03-header">
    <div>
      <h2 id="r03-title">⏰ Routine Mattutina • Ore 03:00</h2>
      <p class="r03-subtitle">Attivazione giornaliera prima di iniziare</p>
    </div>
    <div class="r03-metrics">
      <div class="r03-calories" role="status" aria-live="polite">🔥 Calorie bruciate totali: <span class="r03-total" id="r03-total">0</span> kcal <span class="r03-today">(Oggi: <span id="r03-today">0</span> / 188 kcal)</span></div>
      <button type="button" class="r03-reset" id="r03-reset" title="Azzera lo storico: le attività completate oggi restano confermate">Azzera totale</button>
    </div>
  </div>
  <div class="r03-grid" id="r03-grid">
    <article class="r03-card" data-r03-id="flessioni">
      <svg class="r03-art" viewBox="0 0 160 94" aria-hidden="true" focusable="false">

        <g class="r03-wheel"><circle class="r03-line" cx="22" cy="80" r="6"/><path class="r03-line" d="M22 74V86M16 80H28"/></g>

</section>
<script>
(function(){
  'use strict';
  const root=document.getElementById('case247-routine03');
  if(!root||root.dataset.r03Init)return;
  root.dataset.r03Init='1';
  const key='case247-routine03-v1';
  const kcal={flessioni:16,addominali:12,tapis:160};
  const keys=Object.keys(kcal);
  const getDate=()=>{
    const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Rome',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
    const data=Object.fromEntries(parts.map(x=>[x.type,x.value]));
    return data.year+'-'+data.month+'-'+data.day;
  };
  const fresh=()=>({day:getDate(),historyTotal:0,done:[]});
  const daily=state=>state.done.reduce((sum,id)=>sum+kcal[id],0);
  let state;
  let canSave=true;
  function load(){
    try{
      const raw=JSON.parse(localStorage.getItem(key));
      if(!raw||typeof raw!=='object')return fresh();
      const done=Array.isArray(raw.done)?[...new Set(raw.done.filter(id=>keys.includes(id)))]:[];
      return {day:/^\d{4}-\d{2}-\d{2}$/.test(raw.day||'')?raw.day:getDate(),
        historyTotal:Number.isSafeInteger(raw.historyTotal)&&raw.historyTotal>=0?raw.historyTotal:0,done};
    }catch(_){canSave=false;return fresh()}
  }
  function save(){
    try{localStorage.setItem(key,JSON.stringify(state));canSave=true}
    catch(_){canSave=false}
    root.querySelector('#r03-notice').textContent=canSave?'':'Memoria locale non disponibile: le spunte potrebbero non conservarsi.';
  }
  function rollover(){
    const today=getDate();
    if(state.day===today)return false;
    if(state.day<today)state.historyTotal+=daily(state);
    state.day=today;state.done=[];
    save();
    return true;
  }
  function render(animate){
    const today=daily(state),value=state.historyTotal+today;
    const total=root.querySelector('#r03-total');
    total.textContent=String(value);
    root.querySelector('#r03-today').textContent=String(today);
    if(animate){
      total.classList.remove('r03-pop');
      void total.offsetWidth;
      total.classList.add('r03-pop');
    }
    keys.forEach(id=>{
      const card=root.querySelector('[data-r03-id="'+id+'"]');
      const completed=state.done.includes(id);
      card.hidden=completed;
      card.classList.remove('r03-completing');
      const field=card.querySelector('input');
      field.checked=completed;field.disabled=completed;
    });
    const complete=state.done.length===keys.length;
    root.querySelector('#r03-complete').hidden=!complete;
    root.querySelector('#r03-grid').hidden=complete;
  }
  state=load();
  rollover();
  render(false);
  root.addEventListener('change',event=>{
    const input=event.target.closest('input[data-r03-check]');
    if(!input||!input.checked)return;
    state=load();rollover();
    const id=input.dataset.r03Check;
    if(!Object.prototype.hasOwnProperty.call(kcal,id)||state.done.includes(id)){render(false);return}
    state.done.push(id);save();
    const card=input.closest('.r03-card');
    card.classList.add('r03-completing');
    input.disabled=true;
    const today=daily(state);
    const total=root.querySelector('#r03-total');
    total.textContent=String(state.historyTotal+today);
    root.querySelector('#r03-today').textContent=String(today);
    total.classList.remove('r03-pop');void total.offsetWidth;total.classList.add('r03-pop');
    window.setTimeout(()=>render(false),290);
  });
  root.querySelector('#r03-reset').addEventListener('click',()=>{
    if(!window.confirm('Azzerare lo storico delle calorie mantenendo gli esercizi già completati oggi?'))return;
    state=load();rollover();state.historyTotal=0;save();render(true);
  });
  function refresh(){state=load();rollover();render(false)}
  window.addEventListener('storage',event=>{if(event.key===key)refresh()});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
  window.addEventListener('focus',refresh);
  window.setInterval(()=>{if(getDate()!==state.day)refresh()},30000);
  // CASE247 ora usa una shell 100vh: il widget viene montato sotto l'header
  // della shell, prima del contenuto e del widget «Il mio Perché».
  function placeBelowHeader(){
    const app=document.getElementById('saas-app');
    const header=app&&app.querySelector('.saas-header');
    if(!header)return false;
    if(root.parentNode!==app)header.insertAdjacentElement('afterend',root);
    root.classList.remove('saas-legacy-hidden');
    return true;
  }
  if(!placeBelowHeader()){
    const observer=new MutationObserver(()=>{if(placeBelowHeader())observer.disconnect()});
    observer.observe(document.documentElement,{childList:true,subtree:true});
    document.addEventListener('DOMContentLoaded',()=>{if(placeBelowHeader())observer.disconnect()},{once:true});
  }
})();
</script>
