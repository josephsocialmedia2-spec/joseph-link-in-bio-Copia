<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Real Estate Weekly · Copia A4</title>
<style>
:root{--navy:#13304c;--blue:#1979b1;--gold:#b9944f;--ink:#26394b;--muted:#667b89;--line:#dfe8ee}
*{box-sizing:border-box}body{margin:0;background:#e9eef2;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.topbar{position:sticky;top:0;z-index:99;background:#fff;border-bottom:1px solid var(--line);padding:12px;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}.topbar button,.topbar a{border:0;background:var(--navy);color:white;border-radius:12px;padding:11px 18px;text-decoration:none;cursor:pointer;font-weight:bold}.topbar a{background:#e5f0f6;color:var(--navy)}.topbar small{color:var(--muted)}
.sheet{background:white;width:210mm;height:297mm;margin:18px auto;overflow:hidden;box-shadow:0 7px 30px #10284022;position:relative;padding:17mm 17mm 15mm;page-break-after:always;break-after:page}
.mast{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.11em;font-weight:bold;color:var(--navy);text-transform:uppercase}
.mast .issue{color:#6b8195;font-weight:normal}.edge{position:absolute;right:-40mm;top:-45mm;width:105mm;height:85mm;border:14mm solid #e8f2f9;border-radius:50%;z-index:0;pointer-events:none}
.wave{height:7mm;border-radius:100% 20% 85% 15%;background:linear-gradient(105deg,#1875ae,#dceef5 72%,#c6a460);margin:9mm 0 10mm}
.kicker{font-size:10px;letter-spacing:.18em;color:var(--blue);text-transform:uppercase;font-weight:800}
h1{font-size:38px;line-height:1.04;color:var(--navy);margin:9mm 0 4mm;letter-spacing:-.04em}h2{font-size:29px;line-height:1.12;letter-spacing:-.035em;color:var(--navy);margin:7mm 0 4mm}h3{font-size:17px;line-height:1.2;color:var(--navy);margin:0 0 3mm}
p{font-size:12px;line-height:1.7;margin:0 0 4mm}small,.small{font-size:10px;line-height:1.5;color:var(--muted)}.subtitle{font-size:16px;color:#5d7184}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6mm}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm}.card{border:1px solid var(--line);border-radius:5mm;padding:5mm;background:#fff;break-inside:avoid}.light{background:#f4f8fb}.goldline{border-left:3px solid var(--gold)}.big-number{font-size:29px;color:var(--blue);font-weight:800}.photo{border-radius:6mm;background:linear-gradient(145deg,#dbeaf3,#f7fafb);height:67mm;overflow:hidden;position:relative}.photo svg{width:100%;height:100%;display:block}.photo figcaption{position:absolute;bottom:0;right:0;padding:3mm 5mm;background:#fffdf0e8;color:#586879;font-size:9px;border-top-left-radius:4mm}.stamp{display:inline-block;color:#7d653b;background:#fff7e6;border-radius:20px;padding:2.5mm 4mm;font-size:9px;font-weight:bold;text-transform:uppercase;letter-spacing:.08em}.card .source{font-size:9px;color:#647686;margin-bottom:3mm}.card p{font-size:11px;line-height:1.55}.source-link{font-size:9px;color:#236d9d;overflow-wrap:anywhere}.divider{border:0;border-top:1px solid var(--line);margin:7mm 0}.quote{font-size:21px;color:var(--navy);line-height:1.35;border-left:4px solid var(--gold);padding-left:6mm;margin:10mm 0}.footer{position:absolute;bottom:9mm;left:17mm;right:17mm;display:flex;justify-content:space-between;border-top:1px solid #dce5ea;padding-top:3mm;color:#758596;font-size:9px}.spacer{height:8mm}.alert{border:1px solid #eadbb7;background:#fffaf0;padding:4mm;border-radius:4mm;color:#785f34;font-size:10px}.listline{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:5mm 0;font-size:13px}.listline b{color:var(--blue)}.page-title{font-size:14px;font-weight:bold;color:var(--navy)}.footnote{font-size:9px;color:#697b8b;line-height:1.4}.hero-overlay{position:absolute;inset:auto 6mm 6mm 6mm;color:white;text-shadow:0 1px 5px #123}.caption{font-size:10px;color:#7b8a96;margin-top:2mm}
@media print{@page{size:A4;margin:0}body{background:#fff}.topbar{display:none!important}.sheet{width:210mm;height:297mm;margin:0;box-shadow:none;page-break-after:always;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}}@media(max-width:850px){.sheet{zoom:.7;margin:10px auto}}@media(max-width:580px){.sheet{zoom:.47}}
</style></head><body><div class="topbar"><a href="./">← Centro editoriale</a><small id="printStatus">Verifica chiusura editoriale…</small><button id="doPrint" disabled>Stampa / Salva PDF</button></div><main id="pages"></main>
<script>
(()=>{'use strict';
const KEY='jm-real-estate-weekly-v1';const root=document.getElementById('pages'),status=document.getElementById('printStatus'),button=document.getElementById('doPrint');
let m;try{m=JSON.parse(localStorage.getItem(KEY)||'null')}catch(_){}
function e(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c]))}
function pnum(n){return '<div class="footer"><span>JOSEPH MALAFRONTE · REAL ESTATE WEEKLY</span><span>'+String(n).padStart(2,'0')+'</span></div>'}
function mast(){return '<div class="mast"><span>JOSEPH MALAFRONTE <span style="font-weight:normal;color:#7290a2">/ DIGITAL STRATEGIST</span></span><span class="issue">REAL ESTATE WEEKLY · N. '+e(m.issue||'01')+'</span></div>'}
function page(n,inner){return '<section class="sheet">'+mast()+'<div class="edge"></div>'+inner+pnum(n)+'</section>'}
function skyline(){return '<svg viewBox="0 0 600 380" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustrazione originale di paesaggio alpino"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#b8d7ee"/><stop offset="1" stop-color="#edf6fa"/></linearGradient></defs><path fill="url(#sky)" d="M0 0h600v380H0z"/><path fill="#adc6cf" d="M0 250 90 90 150 184 242 48 342 194 450 88 600 245v135H0z"/><path fill="#f1f6f7" d="m220 92 22-44 28 48-21-13-9 15-8-20zM73 128l17-38 29 41-20-10-8 13zM433 122l17-34 32 40-28-16-10 14z"/><path fill="#6e9bac" d="M0 250q130-70 280 5t320-22v147H0z"/><path fill="#d0dbcf" d="M0 280q110-50 270-12t330 14v98H0z"/><path fill="#b9cbd2" d="M0 327q220-36 600 5v48H0z"/><g fill="#f3e9d6" stroke="#6c8395" stroke-width="2"><path d="M107 227h74v77h-74z"/><path d="M205 198h65v105h-65z"/><path d="M287 235h78v76h-78z"/><path d="M395 205h71v102h-71z"/></g><g fill="#b37161"><path d="m95 227 48-29 48 29zM195 198l42-26 43 26zM276 235l50-27 50 27zM383 205l48-35 46 35z"/></g><path d="M0 341q200-12 350 18t250-13v34H0" fill="#82b7c4"/></svg>'}
function property(){return '<svg viewBox="0 0 600 380" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustrazione architettonica di abitazione"><defs><linearGradient id="hs" x2="0" y2="1"><stop stop-color="#c7e3f4"/><stop offset="1" stop-color="#fff"/></linearGradient></defs><rect width="600" height="380" fill="url(#hs)"/><circle cx="480" cy="72" r="43" fill="#f4e0b3"/><path d="M0 294q160-100 300 0t300-21v107H0" fill="#9bc4b7"/><path d="M82 175 291 67l206 108v169H82z" fill="#f6f6ef" stroke="#92aab5" stroke-width="4"/><path d="m68 175 223-129 226 129" fill="none" stroke="#6c8799" stroke-width="13"/><rect x="145" y="196" width="94" height="91" fill="#90bccd"/><rect x="288" y="193" width="129" height="140" fill="#91b7c4"/><rect x="432" y="203" width="41" height="89" fill="#9dc0cf"/><path d="M0 333q200-30 600 5v42H0" fill="#c0d5c4"/></svg>'}
function photo(art,height){return '<figure class="photo" style="margin:0;height:'+height+'mm">'+(art==='home'?property():skyline())+'<figcaption>Immagine illustrativa · non è un immobile in vendita</figcaption></figure>'}
if(!m||!m.closed||!Array.isArray(m.items)||!m.items.some(x=>x.status==='approved')){
root.innerHTML='<section class="sheet"><div class="kicker">Stampa protetta</div><h1>Edizione non approvata</h1><p>Apri il centro editoriale, verifica gli articoli, approvali e conferma la chiusura editoriale. Solo allora potrai ottenere la copia PDF.</p></section>';status.textContent='Stampa bloccata: approvazione editoriale mancante';return;
}
let articles=m.items.filter(x=>x.status==='approved'&&/^https:\/\//i.test(x.url)).slice(0,8);
if(!articles.length){status.textContent='Nessuna fonte pubblicabile';return;}
const cover=e(m.cover||'Avigliana e Valle di Susa: il mercato della settimana'),period=e(m.period||'Settimana editoriale da specificare'),ed=e(m.editorial||'Analizzare con metodo domanda, prezzi richiesti e caratteristiche degli immobili significa prendere decisioni più informate. Il valore di un immobile nasce dall’incontro tra dati verificabili, presentazione e riscontro reale del mercato.');
const sourceCard=(x,i)=>'<div class="card" style="margin-bottom:4mm"><div class="kicker">'+e(x.source||'Fonte')+' · '+e(x.date||'Data da controllare')+'</div><h3 style="margin-top:3mm">'+e(x.title)+'</h3><p>'+e(x.summary)+'</p><div class="source-link">Fonte originale: '+e(x.url)+'</div></div>';
let html='';
html+=page(1,'<div class="kicker" style="margin-top:22mm">Rivista indipendente · Edizione '+e(m.issue)+'</div><h1>Real Estate<br>Weekly<span style="color:#bb9854">.</span></h1><p class="subtitle">'+cover+'</p><div class="wave"></div>'+photo('landscape',105)+'<div class="spacer"></div><div class="grid2"><div><div class="kicker">Territorio</div><h3>Avigliana e Valle di Susa</h3><p>Notizie, mercato, credito e prospettive immobiliari.</p></div><div class="card light"><div class="stamp">Edizione approvata</div><h3 style="margin-top:5mm">Il mercato, letto con metodo</h3><p>'+period+'</p></div></div>');
html+=page(2,'<div class="kicker" style="margin-top:12mm">Sommario ed editoriale</div><h2>Le notizie che contano.<br>Le decisioni che restano.</h2><div class="wave"></div><div class="grid2"><div><div class="listline"><span>03 · In evidenza</span><b>03</b></div><div class="listline"><span>04 · Top news</span><b>04</b></div><div class="listline"><span>05 · Mutui e norme</span><b>05</b></div><div class="listline"><span>06 · Mercato locale</span><b>06</b></div><div class="listline"><span>07 · Marketing immobiliare</span><b>07</b></div><div class="listline"><span>08 · Servizi e contatti</span><b>08</b></div></div><div>'+photo('landscape',64)+'<p class="caption">Avigliana e Valle di Susa · Visuale illustrativa.</p></div></div><div class="spacer"></div><div class="card light goldline"><div class="kicker">Editoriale proposto · Joseph Malafronte</div><h3>Informazione prima dell’azione</h3><p>'+ed+'</p><p class="small">Testo editoriale approvato per questa edizione; non è una citazione trascritta da un’intervista.</p></div>');
html+=page(3,'<div class="kicker" style="margin-top:12mm">Sezione 01 · In primo piano</div><h2>Il fatto della settimana</h2><div class="wave"></div>'+photo('landscape',77)+'<div class="spacer"></div>'+(articles[0]?sourceCard(articles[0],0):'')+'<div class="quote">«Un’informazione utile collega i fatti alle decisioni, senza sostituire i dati locali con supposizioni.»</div><div class="alert">Il possibile impatto sul mercato di Avigliana va valutato con dati territoriali verificati, non dedotto automaticamente dalla tendenza nazionale.</div>');
html+=page(4,'<div class="kicker" style="margin-top:12mm">Sezione 02 · Top news</div><h2>Il mercato sotto la lente</h2><div class="wave"></div><div class="grid2"><div>'+photo('home',62)+'</div><div><div class="card light"><h3>Fonti e metodo</h3><p>Questa selezione riporta sintesi originali degli articoli approvati. Ogni contenuto conserva il collegamento alla fonte primaria, la data e la testata.</p></div></div></div><div class="spacer"></div>'+articles.slice(1,4).map(sourceCard).join('')+(articles.length<2?'<p class="small">Non sono stati approvati altri articoli: nessun contenuto aggiuntivo è stato inventato.</p>':''));
const credit=articles.filter(x=>/mutu|fisc|bonus|cred|banc|legge|norm/i.test(x.title+' '+x.summary));
html+=page(5,'<div class="kicker" style="margin-top:12mm">Sezione 03 · Credito e normative</div><h2>Mutui, fisco e regole:<br>cosa verificare</h2><div class="wave"></div><div class="grid2"><div class="card light"><div class="kicker">Credito</div><h3>La sostenibilità prima della rata</h3><p>TAEG, durata, importo finanziabile e spese accessorie sono variabili da confrontare su preventivi aggiornati. Nessun tasso è indicato senza una fonte datata.</p></div><div class="card light"><div class="kicker">Norme</div><h3>Norma approvata o proposta?</h3><p>Ogni agevolazione o novità deve distinguere il testo vigente dalle iniziative ancora in discussione. Per casi individuali serve un professionista competente.</p></div></div><div class="spacer"></div>'+(credit.length?credit.slice(0,3).map(sourceCard).join(''):'<div class="alert">In questa edizione non risultano articoli specifici su mutui, fisco o normative approvati nel registro: nessun aggiornamento legislativo viene presentato come certo.</div>'));
html+=page(6,'<div class="kicker" style="margin-top:12mm">Sezione 04 · Territorio</div><h2>Avigliana e Valle di Susa</h2><div class="wave"></div>'+photo('landscape',83)+'<div class="spacer"></div><div class="grid3"><div class="card"><div class="kicker">Prezzi</div><h3>Domanda o rogiti?</h3><p>Distinguere prezzi richiesti e prezzi conclusi.</p></div><div class="card"><div class="kicker">Domanda</div><h3>Chi cerca casa?</h3><p>Osservare metrature, stato e zona.</p></div><div class="card"><div class="kicker">Contesto</div><h3>Servizi e accessi</h3><p>Leggere infrastrutture e qualità abitativa.</p></div></div><div class="spacer"></div><div class="card goldline light"><h3>Il punto di vista locale</h3><p>Le notizie nazionali sono il contesto; le decisioni immobiliari richiedono comparabili, sopralluoghi e verifiche documentali riferiti alla microzona.</p></div>');
html+=page(7,'<div class="kicker" style="margin-top:12mm">Sezione 05 · Il metodo</div><h2>La casa merita una<br>presentazione migliore</h2><div class="wave"></div>'+photo('home',66)+'<div class="spacer"></div><div class="grid2"><div class="card"><div class="kicker">01</div><h3>Analisi</h3><p>Capire il posizionamento dell’immobile e il contesto competitivo.</p></div><div class="card"><div class="kicker">02</div><h3>Contenuti</h3><p>Fotografie, testi, materiali chiari e coerenti.</p></div><div class="card"><div class="kicker">03</div><h3>Distribuzione</h3><p>Pianificare la visibilità sui canali digitali pertinenti.</p></div><div class="card"><div class="kicker">04</div><h3>Risultati</h3><p>Misurare riscontri reali senza dichiarare vendite non verificate.</p></div></div><div class="spacer"></div><p class="footnote">Joseph Malafronte opera nella strategia e promozione digitale. Le attività riservate alla mediazione immobiliare sono svolte esclusivamente da professionisti abilitati.</p>');
html+=page(8,'<div class="kicker" style="margin-top:12mm">Quarta di copertina</div><h2>La prossima opportunità<br>inizia da una buona strategia.</h2><div class="wave"></div><div class="grid2"><div>'+photo('landscape',82)+'</div><div><div class="card light"><div class="kicker">Joseph Malafronte</div><h3>Digital Strategist</h3><p>Strategie di comunicazione, promozione immobiliare e contenuti digitali orientati alla qualità della presentazione.</p><p><b>WhatsApp</b><br>371 370 8294</p><p><b>Territorio</b><br>Avigliana · Valle di Susa</p></div></div></div><div class="spacer"></div><div class="card goldline"><h3>Vuoi capire come presentare il tuo immobile?</h3><p>Richiedi un primo confronto sul posizionamento e sulla promozione digitale. I servizi di mediazione sono riservati ai professionisti abilitati.</p><p class="small">Pubblicazione informativa indipendente. Le immagini del presente numero sono illustrazioni originali; non rappresentano immobili realmente disponibili. Gli articoli sono rielaborazioni sintetiche e rimandano alle fonti originali.</p></div>');
root.innerHTML=html;status.textContent='Edizione '+(m.issue||'01')+' · '+articles.length+' articoli approvati · 8 pagine A4';button.disabled=false;button.onclick=()=>window.print();
})();
</script></body></html>
