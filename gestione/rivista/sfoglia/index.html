  <title>Real Estate Weekly · Joseph Malafronte</title>
  <style>
    :root { color-scheme:dark; --navy:#071d35; --gold:#d4b16c; --white:#fff; --muted:#d1ddea; }
    * { box-sizing:border-box; }
    html { min-height:100%; }
    body {
      min-height:100vh; min-height:100svh; margin:0; padding:28px 20px;
      display:flex; justify-content:center; align-items:center;
      background:radial-gradient(ellipse at 50% 0%,#173b61 0%,var(--navy) 62%);
      font-family:Arial,Helvetica,sans-serif; color:var(--white); text-align:center;
    }
    main { width:100%; max-width:800px; margin:auto; }
    .publisher { color:var(--gold); font-size:12px; font-weight:700; letter-spacing:.15em; line-height:1.6; margin:0 0 30px; }
    h1 {
      font:700 clamp(37px,8vw,76px)/1.08 Georgia,"Times New Roman",serif;
      letter-spacing:.005em; margin:0 0 20px; text-wrap:balance;
    }
    .edition { max-width:630px; margin:0 auto 44px; color:var(--muted); font-size:clamp(16px,2.5vw,19px); line-height:1.65; }
    .download {
      background:var(--gold); color:var(--navy); display:inline-flex; align-items:center; justify-content:center;
      min-height:58px; min-width:min(100%,305px); padding:18px 28px; border-radius:7px;
      font-size:16px; font-weight:800; letter-spacing:.04em; text-decoration:none;
      box-shadow:0 12px 35px #0004; transition:filter .15s ease,transform .15s ease;
    }
    .download:hover { filter:brightness(1.09); transform:translateY(-1px); }
    .download:focus-visible { outline:3px solid var(--white); outline-offset:5px; }
    @media (max-width:600px) {
      body { padding:42px 22px 56px; }
      .publisher { font-size:10px; margin-bottom:23px; }
      .edition { margin-bottom:36px; }
      .download { width:100%; max-width:360px; }
    }
    @media (prefers-reduced-motion:reduce) { .download { transition:none; } }
  </style>
</head>
