<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Archivio branch | CASE247</title><style>:root{color-scheme:dark;font-family:system-ui,Arial,sans-serif;background:#0b1522;color:#eff5fb}*{box-sizing:border-box}body{margin:0}main,header{max-width:1120px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #31465a}a{color:#94d8fa}h1{font-size:clamp(28px,4vw,40px)}p{color:#b5c9da}input,select,button{background:#152c3f;color:white;border:1px solid #446780;border-radius:9px;padding:12px;font:inherit}input{flex:1;min-width:180px}.tools{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}.rows{display:grid;gap:8px}.item{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px;border:1px solid #324d62;background:#122638;border-radius:10px}.item strong{overflow-wrap:anywhere}.item small{display:block;color:#a9c1d2;margin-top:5px}.item a{flex-shrink:0}.pager{display:flex;align-items:center;gap:15px;justify-content:center;margin:25px 0}.pager button:disabled{opacity:.3}.note{font-size:13px}@media(max-width:600px){.item{align-items:flex-start;flex-direction:column}}</style></head><body><header><strong>CASE247 · Archivio tecnico</strong><a href="../menu-operativo/">Menu operativo</a></header><main><h1>Branch GitHub</h1><p>Archivio di sviluppo, backup, test e produzione. Non serve aprirlo per la normale pubblicazione social.</p><div class="tools"><input type="search" id="q" placeholder="Cerca branch per nome" aria-label="Cerca branch"><select id="type" aria-label="Categoria"><option value="">Tutte le categorie</option><option value="Produzione">Produzione</option><option value="Sviluppo">Sviluppo</option><option value="Correzione">Correzione</option><option value="Backup">Backup</option><option value="Test">Test</option><option value="Audit">Audit</option><option value="Altro">Altro</option></select><button id="reload">Aggiorna GitHub</button></div><p id="status" role="status">Caricamento…</p><div id="list" class="rows"></div><nav class="pager" aria-label="Pagine"><button id="prev">Precedente</button><span id="counter"></span><button id="next">Successiva</button></nav><p class="note">Risultati: massimo 12 per pagina. I collegamenti aprono sorgenti GitHub, non anteprime funzionanti del sito.</p></main><script>
(()=>{'use strict';const api='https://api.github.com/repos/josephsocialmedia2-spec/joseph-link-in-bio-Copia',base='https://github.com/josephsocialmedia2-spec/joseph-link-in-bio-Copia/tree/';let data=[],page=0;const $=id=>document.getElementById(id),kind=n=>n==='main'?'Produzione':n.startsWith('backup/')?'Backup':n.startsWith('fix/')?'Correzione':n.startsWith('test/')?'Test':n.startsWith('audit/')?'Audit':/^(feat|feature)\//.test(n)?'Sviluppo':'Altro';function render(){const q=$('q').value.trim().toLowerCase(),t=$('type').value;const arr=data.filter(b=>b.name.toLowerCase().includes(q)&&(!t||kind(b.name)===t));const pages=Math.max(1,Math.ceil(arr.length/12));page=Math.min(page,pages-1);$('list').replaceChildren();arr.slice(page*12,(page+1)*12).forEach(b=>{const row=document.createElement('article');row.className='item';const info=document.createElement('div'),name=document.createElement('strong'),small=document.createElement('small'),link=document.createElement('a');name.textContent=b.name;small.textContent=kind(b.name)+(b.sha?' · '+b.sha.slice(0,10):'');link.textContent='Apri su GitHub';link.href=base+b.name.split('/').map(encodeURIComponent).join('/');link.target='_blank';link.rel='noopener noreferrer';info.append(name,small);row.append(info,link);$('list').append(row)});if(!arr.length)$('list').textContent='Nessun branch corrispondente.';$('counter').textContent=(arr.length?((page+1)+' / '+pages):'0 / 0')+' · '+arr.length+' branch';$('prev').disabled=page===0;$('next').disabled=page>=pages-1;}
async function load(){ $('reload').disabled=true;$('status').textContent='Verifica branch GitHub…';try{let a=[];for(let i=1;i<=20;i++){const r=await fetch(api+'/branches?per_page=100&page='+i,{cache:'no-store'});if(!r.ok)throw Error('GitHub HTTP '+r.status);const j=await r.json();if(!Array.isArray(j))throw Error('Formato non valido');a.push(...j.map(b=>({name:b.name,sha:b.commit?.sha||''})));if(j.length<100)break;if(i===20)throw Error('Limite di paginazione')}data=a.sort((a,b)=>(a.name==='main'?-1:b.name==='main'?1:a.name.localeCompare(b.name)));$('status').textContent=data.length+' branch · aggiornati '+new Date().toLocaleString('it-IT');page=0;render()}catch(e){$('status').textContent='Aggiornamento non disponibile: '+e.message+'.';try{const r=await fetch('../cc-branches-snapshot.json');const j=await r.json();data=(j.branches||[]).map(b=>({name:b.name,sha:b.sha}));$('status').textContent+=' Archivio di riserva, non in tempo reale.';render()}catch(_){}}finally{$('reload').disabled=false;}}
$('q').addEventListener('input',()=>{page=0;render()});$('type').addEventListener('change',()=>{page=0;render()});$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('reload').onclick=load;load();})();
</script></body></html>
